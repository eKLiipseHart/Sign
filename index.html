<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <title>SWG Sign Designer</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="container">

    <div class="left-panel">

        <h1>SWG Sign Designer</h1>

        <label>Style Pack</label>

        <select id="stylePackSelect">
            <option value="">-- Select Style Pack --</option>
            <option value="imperial">Imperial Military</option>
            <option value="cyberpunk">Cyberpunk Neon</option>
            <option value="hutt">Hutt Cartel</option>
            <option value="rebel">Rebel Alliance</option>
            <option value="corporate">Corporate Coruscant</option>
            <option value="nightclub">Nightclub</option>
        </select>

        <!-- REMOVED:
             - Faction Color Presets label
             - Faction buttons
             - Faction palette container
        -->

        <label>Sign Text</label>
        <textarea id="editor"></textarea>

        <div class="counter">
            Characters: <span id="charCount">0</span> / 256
        </div>

        <label>Quick Colors</label>

        <div class="colors">
            <button class="colorBtn" data-color="#ff0000" style="background:#ff0000"></button>
            <button class="colorBtn" data-color="#00ff00" style="background:#00ff00"></button>
            <button class="colorBtn" data-color="#0080ff" style="background:#0080ff"></button>
            <button class="colorBtn" data-color="#ffff00" style="background:#ffff00"></button>
            <button class="colorBtn" data-color="#AA00FF" style="background:#AA00FF"></button>
            <button class="colorBtn" data-color="#DB7093" style="background:#DB7093"></button>
            <button class="colorBtn" data-color="#ffffff" style="background:#ffffff"></button>
        </div>

        <label>Custom Color Picker</label>

        <div class="colorPickerArea">
            <input type="color" id="colorWheel" value="#00ffff">
            <input type="text" id="hexInput" value="#00ffff" maxlength="7">
            <button id="insertCustomColor">Insert Color</button>
        </div>

        <label>Per-Letter Gradient Generator</label>

        <div class="gradientArea">
            <input type="text" id="gradientText" placeholder="Enter text">

            <div class="gradientColors">
                <input type="color" id="gradientStart" value="#ff0000">
                <input type="color" id="gradientEnd" value="#00ffff">
            </div>

            <button id="generateLetterGradient">Generate Letter Gradient</button>
        </div>

        <label>Style Characters</label>

        <div class="symbolBar">
            <button class="symbolBtn">///</button>
            <button class="symbolBtn">+++</button>
            <button class="symbolBtn">===</button>
            <button class="symbolBtn">***</button>
            <button class="symbolBtn">~~~</button>
            <button class="symbolBtn">>>></button>
            <button class="symbolBtn"><<<</button>
            <button class="symbolBtn">|||</button>
            <button class="symbolBtn">###</button>
            <button class="symbolBtn">---</button>
        </div>

        <div class="buttons">
            <button id="dividerBtn">Divider</button>
            <button id="borderBtn">Border</button>
            <button id="copyBtn">Copy for SWG</button>
            <button id="randomBtn">Random</button>
        </div>

    </div>

    <div class="right-panel">
        <h2>Preview</h2>
        <div id="preview"></div>
    </div>

</div>

<script src="renderer.js"></script>

</body>
</html>
